name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MoneyBrain.Web/MoneyBrain.Web.sln

      - name: Create bin/Debug directory (workaround for .NET 10.0 SDK MSB3552)
        run: mkdir -p MoneyBrain.Web/MoneyBrain.Web/bin/Debug

      - name: Build
        run: dotnet build MoneyBrain.Web/MoneyBrain.Web.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MoneyBrain.Web/MoneyBrain.Web.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults
