name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MoneyBrain.Web/MoneyBrain.Web/MoneyBrain.Web.csproj

      - name: Create bin/Debug directory (workaround for .NET 10.0 SDK MSB3552)
        run: mkdir -p MoneyBrain.Web/MoneyBrain.Web/bin/Debug

      - name: Build
        run: dotnet build MoneyBrain.Web/MoneyBrain.Web/MoneyBrain.Web.csproj --configuration Release --no-restore

      # Add a `dotnet test` step here once the repository has a test project.
