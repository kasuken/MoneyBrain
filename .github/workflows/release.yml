# Production releases. Run this workflow on main to cut the next version, or publish a
# GitHub release. The steps live in kasuken/.github; see its RELEASING.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch
      redeploy:
        description: Existing tag to redeploy instead (rollback), e.g. v1.0.0
        type: string
        default: ''

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  release:
    uses: kasuken/.github/.github/workflows/release-azure-webapp.yml@main
    with:
      app-name: moneybrain-prod001
      web-project: MoneyBrain.Web/MoneyBrain.Web/MoneyBrain.Web.csproj
      base-url: https://moneybrain-prod001.azurewebsites.net
      bump: ${{ inputs.bump || 'patch' }}
      redeploy: ${{ inputs.redeploy || '' }}
    secrets: inherit
