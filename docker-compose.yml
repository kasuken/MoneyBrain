services:
  moneybrain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneybrain-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=moneybrain;Username=moneybrain;Password=moneybrain_secret
      - DatabaseProvider=PostgreSQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - moneybrain-network

  postgres:
    image: postgres:17-alpine
    container_name: moneybrain-postgres
    environment:
      - POSTGRES_DB=moneybrain
      - POSTGRES_USER=moneybrain
      - POSTGRES_PASSWORD=moneybrain_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneybrain -d moneybrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - moneybrain-network

volumes:
  postgres-data:

networks:
  moneybrain-network:
    driver: bridge
