services:
  moneybrain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneybrain-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=moneybrain;User Id=sa;Password=MoneyBrain_Secret1!;TrustServerCertificate=True
      - DatabaseProvider=SqlServer
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - moneybrain-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: moneybrain-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MoneyBrain_Secret1!
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P MoneyBrain_Secret1! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - moneybrain-network

volumes:
  sqlserver-data:

networks:
  moneybrain-network:
    driver: bridge
